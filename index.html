<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Futebol + Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">
        <!-- SEÇÃO 1: PLACAR INTERATIVO -->
        <section class="scoreboard-section">
            <h2>Placar do Jogo</h2>
            <div class="timer" id="gameTimer">00:00</div>
            
            <div class="match-box">
                <div class="team">
                    <input type="text" value="Time Mandante" class="team-name">
                    <div class="score" id="scoreA">0</div>
                    <div class="score-controls">
                        <button onclick="changeScore('A', 1)">+</button>
                        <button onclick="changeScore('A', -1)">-</button>
                    </div>
                </div>

                <div class="vs">VS</div>

                <div class="team">
                    <input type="text" value="Time Visitante" class="team-name">
                    <div class="score" id="scoreB">0</div>
                    <div class="score-controls">
                        <button onclick="changeScore('B', 1)">+</button>
                        <button onclick="changeScore('B', -1)">-</button>
                    </div>
                </div>
            </div>

            <div class="timer-controls">
                <button id="startBtn" onclick="toggleTimer()">Iniciar Tempo</button>
                <button onclick="resetMatch()">Reiniciar Jogo</button>
            </div>
        </section>

        <!-- SEÇÃO 2: CAMPO TÁTICO -->
        <section class="tactics-section">
            <h2>Prancheta Tática</h2>
            <p>Clique no botão para adicionar um jogador no campo e arraste-o livremente.</p>
            <button class="add-player-btn" onclick="addPlayer()">+ Adicionar Jogador</button>
            
            <div class="pitch" id="footballPitch">
                <div class="center-circle"></div>
                <div class="penalty-area area-left"></div>
                <div class="penalty-area area-right"></div>
            </div>
        </section>

        <!-- NOVA SEÇÃO 3: MINI JOGOS DE FUTEBOL -->
        <section class="games-section">
            <h2>Arena de Jogos</h2>
            
            <!-- ABAS DE NAVEGAÇÃO DOS JOGOS -->
            <div class="game-tabs">
                <button class="tab-btn active" onclick="switchGame('penalties')">Disputa de Pênaltis</button>
                <button class="tab-btn" onclick="switchGame('quiz')">Quiz de Futebol</button>
            </div>

            <!-- JOGO 1: PÊNALTIS -->
            <div id="gamePenalties" class="game-content active">
                <h3>Disputa de Pênaltis</h3>
                <p>Escolha um canto para chutar a bola!</p>
                <div class="goal-area">
                    <button class="goal-corner" onclick="shootPenalty('esquerda')">Esquerda</button>
                    <button class="goal-corner" onclick="shootPenalty('centro')">Centro</button>
                    <button class="goal-corner" onclick="shootPenalty('direita')">Direita</button>
                </div>
                <div id="penaltyResult" class="game-result">Placar: Você 0 x 0 Goleiro</div>
            </div>

            <!-- JOGO 2: QUIZ -->
            <div id="gameQuiz" class="game-content">
                <h3>Quiz de Futebol</h3>
                <div id="quizContainer">
                    <p id="quizQuestion">Carregando pergunta...</p>
                    <div id="quizOptions" class="quiz-options"></div>
                </div>
                <div id="quizResult" class="game-result">Pontuação: 0</div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
